services:
  - type: web
    name: biotrilhos-api
    runtime: docker
    rootDir: Bio_Trilhos_Site/backend_laravel/backend_laravel_app
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: biotrilhos-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: biotrilhos-db
    plan: free
    databaseName: biotrilhos
    user: biotrilhos